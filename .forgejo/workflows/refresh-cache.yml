name: Refresh PGP Worker Cache

on:
  # Trigger when pushing key material, worker cache logic, or this workflow itself.
  push:
    branches:
      - main
    paths:
      - 'public-masterkey.asc'
      - 'transitions/**'
      - '.well-known/**'
      - 'policy'
      - 'worker/**'
      - '.forgejo/workflows/refresh-cache.yml'
  
  # Allow manual trigger with 1-click from Actions tab
  workflow_dispatch:

jobs:
  invalidate-cache:
    runs-on: ubuntu-latest
    name: Clear Cloudflare KV Cache
    
    steps:
      - name: Guardrail - trusted actor
        env:
          TRUSTED_ACTORS: "kareemlukitomo shaquille"
        run: |
          actor="${{ github.actor }}"
          for trusted_actor in ${TRUSTED_ACTORS}; do
            if [ "${actor}" = "${trusted_actor}" ]; then
              exit 0
            fi
          done

          echo "::error::Untrusted actor '${actor}'. Expected one of: ${TRUSTED_ACTORS}."
          echo "::error::Stopping workflow to avoid unauthorized cache mutation."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd worker
          npm ci
      
      - name: Generate KV assets manifest
        run: |
          cd worker
          npm run kv:sync -- --out dist/kv-assets.json

      - name: Validate manifest integrity
        run: |
          cd worker
          npm run kv:validate -- --manifest dist/kv-assets.json
      
      - name: Bulk upload to Cloudflare KV (Production)
        run: |
          cd worker
          npx wrangler kv bulk put dist/kv-assets.json \
            --binding=PGP_ASSETS \
            --remote \
            --preview=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Summary
        run: |
          echo "✅ Cache refreshed for pgp.kareem.one"
          echo "🔄 Updated keys are now live"
          echo "📝 Changes: ${{ github.event.head_commit.message }}"
